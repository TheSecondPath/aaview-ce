# veloster-aa: keep the journal on the SD card across power cuts (Raspberry Pi OS defaults to RAM only).
# The car cuts the Pi's power without warning, so the journal is synced often. Its size is capped.
# Install as /etc/systemd/journald.conf.d/60-veloaa.conf, then: systemctl restart systemd-journald; journalctl --flush
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
MaxRetentionSec=30day
SyncIntervalSec=30s
